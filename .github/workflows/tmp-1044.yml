name: tmp-1044
on:
  push:
    branches: ["claude/tmp-1044-*"]
permissions:
  contents: read
jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: sw_vers; system_profiler SPDisplaysDataType | head -30
      - name: e2e
        env:
          MYGO_E2E: 1
        run: go test -count=1 -v -run 'TestContentWindowResizeRightAfterFrame' ./internal/e2e
